name: Cloud VPS checks

on:
  push:
    branches: [feat/cloud-vps-worker]
  pull_request:
    branches: [main]

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
